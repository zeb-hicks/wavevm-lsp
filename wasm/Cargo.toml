[package]
name = "waveasm-wasm"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "WASM bindings for the Wave2 assembler, used by the Wave2 language server"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
waveasm = { git = "https://github.com/zeb-hicks/wave2_assembler", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
